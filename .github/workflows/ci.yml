name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check src tests

      - name: Run Ruff format check
        run: ruff format --check src tests

      - name: Run MyPy
        run: mypy src

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -e ".[dev]"

      - name: Run API tests
        run: |
          pytest tests/api -v --tb=short -n auto \
            --html=reports/api_report.html --self-contained-html \
            --alluredir=allure-results-api

      - name: Upload API HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-html-report
          path: reports/api_report.html

      - name: Upload Allure results (API)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results-api

  test-ui:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -e ".[dev]"
          playwright install --with-deps chromium firefox webkit

      - name: Run UI tests
        run: |
          pytest tests/ui -v --tb=short -n 2 \
            --html=reports/ui_report.html --self-contained-html \
            --alluredir=allure-results-ui

      - name: Upload UI HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-html-report
          path: reports/ui_report.html

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      - name: Upload Allure results (UI)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: allure-results-ui

  test-contract:
    name: Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -e ".[dev]"

      - name: Run contract tests
        run: |
          pytest tests/contract -v --tb=short -n auto \
            --html=reports/contract_report.html --self-contained-html \
            --alluredir=allure-results-contract

      - name: Upload contract HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-html-report
          path: reports/contract_report.html

      - name: Upload Allure results (Contract)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-contract
          path: allure-results-contract

  allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: [test-api, test-ui, test-contract]
    if: always()
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.7
        if: always()
        with:
          allure_results: allure-results
          allure_report: allure-report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [lint, test-api, test-ui, test-contract, allure-report]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Print job statuses
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "API Tests: ${{ needs.test-api.result }}"
          echo "UI Tests: ${{ needs.test-ui.result }}"
          echo "Contract Tests: ${{ needs.test-contract.result }}"
          echo "Allure Report: ${{ needs.allure-report.result }}"

      - name: Fail if any required job failed
        if: >
          needs.lint.result == 'failure' ||
          needs.test-api.result == 'failure' ||
          needs.test-ui.result == 'failure'
        run: exit 1